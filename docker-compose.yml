services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    depends_on:
      - ai
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    env_file:
      - ./ai/.env
    ports:
      - "4100:4100"
    restart: unless-stopped
