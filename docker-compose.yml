services:
  ui:
    build:
      context: ./ui
      args:
        # VITE_* is inlined into the static bundle at build time.
        VITE_API_URL: ${VITE_API_URL:-/api}
    # The UI is served by Nginx on container port 80 (see ui/Dockerfile).
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-4000}
      HOST: 0.0.0.0
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:${AI_PORT:-4100}}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/health').then((r) => r.json().then((body) => process.exit(r.ok && body.mongo === 'connected' ? 0 : 1))).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    environment:
      NODE_ENV: production
      PORT: ${AI_PORT:-4100}
      HOST: 0.0.0.0
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN}
      # GPT key stays server-side in the private AI service only.
      GPT_API_KEY: ${GPT_API_KEY:-}
      GPT_MODEL: ${GPT_MODEL:-gpt-4o-mini}
      GPT_BASE_URL: ${GPT_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "${AI_PORT:-4100}:${AI_PORT:-4100}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 4100) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
